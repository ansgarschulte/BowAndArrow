<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bogenschießen" />
  <meta name="theme-color" content="#2d5016" />
  <title>Ziel Scheiben Schiessen Leicht Gemacht</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #1a1a2e;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    #game-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas { display: block; touch-action: none; }
    #update-banner {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: linear-gradient(135deg, #e94560, #c62a45);
      color: #fff;
      text-align: center;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom)) 20px;
      font-family: Arial, sans-serif;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
      -webkit-tap-highlight-color: transparent;
      animation: slideUp 0.4s ease-out;
    }
    #update-banner:active { background: linear-gradient(135deg, #c62a45, #a01f38); }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="update-banner" onclick="location.reload(true)">🔄 Neue Version verfügbar — Bitte aktualisieren</div>
  <script>
    (function() {
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
      // Version check
      var currentVersion = null;
      function checkVersion() {
        fetch('/version.json?t=' + Date.now())
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (currentVersion === null) {
              currentVersion = data.version;
            } else if (data.version !== currentVersion) {
              document.getElementById('update-banner').style.display = 'block';
            }
          })
          .catch(function() {});
      }
      checkVersion();
      setInterval(checkVersion, 30000);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
